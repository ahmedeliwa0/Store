  document.querySelectorAll('[data-cu]').forEach(b=>b.onclick=()=>{const o=lines[+b.dataset.cu];ask('تلغي مرتجع الصنف ده؟ القطع هتتخصم من المخزن تاني.','أيوه، إلغاء المرتجع',async()=>{
    await restock([{itemId:o.units[0].itemId,size:o.units[0].size,st:o.units[0].st,color:o.units[0].color,d:-o.units.length}]);
    await Promise.all(o.units.map(x=>db.collection('sales').doc(x.id).update({ret:0,refund:0})));editSales=false;toast('اتلغى المرتجع')})});
}
function cancelOrder(key){
  const mem=sales.filter(x=>okey(x)===key);if(!mem.length)return;
  ask('تلغي الأوردر كله وترجع القطع للمخزن؟ (القطع اللي اترجعت منه هتتمسح من السجل كمان)','أيوه، إلغاء الأوردر',async()=>{
    const snap=mem.map(x=>{const {id,...r}=x;return[id,r]}),adj=mem.filter(x=>!x.ret).map(x=>({itemId:x.itemId,size:x.size,st:x.st,color:x.color,d:1}));
    await restock(adj);
    await Promise.all(snap.map(([id])=>db.collection('sales').doc(id).delete()));editSales=false;
    toast('اتلغى الأوردر',async()=>{await restock(adj.map(a=>({...a,d:-1})));await Promise.all(snap.map(([id,r])=>db.collection('sales').doc(id).set(r)))})})}
</script>
